<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#f8f9fa" rx="8"/>
  
  <!-- Title -->
  <text x="200" y="25" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">BoxCreator — Interlocking Box Assembly</text>
  
  <!-- Box perspective view -->
  <!-- Front face -->
  <polygon points="80,80 200,60 200,180 80,200" fill="#4a90d9" fill-opacity="0.7" stroke="#2c5f8a" stroke-width="2"/>
  <!-- Right face -->
  <polygon points="200,60 320,80 320,200 200,180" fill="#357abd" fill-opacity="0.5" stroke="#2c5f8a" stroke-width="2"/>
  <!-- Top face -->
  <polygon points="80,80 200,60 320,80 200,100" fill="#5ba0e9" fill-opacity="0.4" stroke="#2c5f8a" stroke-width="2"/>
  
  <!-- Notch indicators on front face edge -->
  <line x1="80" y1="120" x2="80" y2="135" stroke="#e74c3c" stroke-width="3"/>
  <line x1="80" y1="150" x2="80" y2="165" stroke="#e74c3c" stroke-width="3"/>
  <line x1="140" y1="190" x2="155" y2="187" stroke="#e74c3c" stroke-width="3"/>
  <line x1="170" y1="195" x2="185" y2="192" stroke="#e74c3c" stroke-width="3"/>
  
  <!-- Labels -->
  <text x="40" y="130" font-family="Arial" font-size="9" fill="#e74c3c">Notch</text>
  <text x="40" y="140" font-family="Arial" font-size="9" fill="#e74c3c">(finger joint)</text>
  
  <!-- Dimension arrows -->
  <line x1="80" y1="220" x2="200" y2="220" stroke="#666" stroke-width="1" marker-start="url(#arrowR)" marker-end="url(#arrowR)"/>
  <text x="140" y="235" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">Width (W)</text>
  
  <line x1="215" y1="200" x2="215" y2="80" stroke="#666" stroke-width="1" marker-start="url(#arrowU)" marker-end="url(#arrowU)"/>
  <text x="230" y="145" font-family="Arial" font-size="10" fill="#666" transform="rotate(90,230,145)">Height (H)</text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowR" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#666"/>
    </marker>
    <marker id="arrowU" markerWidth="6" markerHeight="6" refX="3" refY="5" orient="auto">
      <polygon points="0,0 6,0 3,6" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Notch detail callout -->
  <rect x="250" y="90" width="140" height="80" fill="#fff" stroke="#ccc" stroke-width="1" rx="4"/>
  <text x="320" y="108" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">Notch Detail</text>
  
  <!-- Notch diagram inside callout -->
  <rect x="270" y="115" width="100" height="40" fill="#e8f4fd" stroke="#4a90d9" stroke-width="1"/>
  <rect x="270" y="115" width="15" height="40" fill="#4a90d9" fill-opacity="0.3" stroke="#2c5f8a" stroke-width="1"/>
  <rect x="285" y="115" width="15" height="40" fill="#fff" stroke="#2c5f8a" stroke-width="1"/>
  <rect x="300" y="115" width="15" height="40" fill="#4a90d9" fill-opacity="0.3" stroke="#2c5f8a" stroke-width="1"/>
  <rect x="315" y="115" width="15" height="40" fill="#fff" stroke="#2c5f8a" stroke-width="1"/>
  <rect x="330" y="115" width="15" height="40" fill="#4a90d9" fill-opacity="0.3" stroke="#2c5f8a" stroke-width="1"/>
  <rect x="345" y="115" width="15" height="40" fill="#fff" stroke="#2c5f8a" stroke-width="1"/>
  
  <text x="320" y="168" font-family="Arial" font-size="9" text-anchor="middle" fill="#666">Notch Width · Clearance</text>
  
  <!-- Material thickness callout -->
  <line x1="330" y1="130" x2="360" y2="130" stroke="#e67e22" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="330" y1="150" x2="360" y2="150" stroke="#e67e22" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="355" y1="130" x2="355" y2="150" stroke="#e67e22" stroke-width="1"/>
  <text x="365" y="143" font-family="Arial" font-size="9" fill="#e67e22">Thickness (T)</text>
  
  <!-- Footer -->
  <text x="200" y="280" font-family="Arial" font-size="10" text-anchor="middle" fill="#999">BoxCreator v1.3.7 — FreeCAD Macro</text>
</svg>
